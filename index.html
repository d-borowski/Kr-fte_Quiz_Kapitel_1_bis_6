<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kräfte – Diagnosefragen</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111827;
    --muted: #4b5563;
    --line: #9ca3af;
    --accent: #1d4ed8;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --hover: #eff6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: calc(clamp(18px, 2.4vw, 34px) * var(--zoom, 1));
    line-height: 1.35;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1em;
    padding: 0.6em 1.2em;
    border-bottom: 3px solid var(--accent);
    font-size: 0.75em;
    color: var(--muted);
  }
  header .kapitel { font-weight: 700; color: var(--accent); }
  .rechts { display: flex; align-items: center; gap: 0.8em; }
  .zoom { display: flex; gap: 0.3em; }
  .zoom button {
    font: inherit;
    font-weight: 700;
    min-width: 2.4em;
    padding: 0.15em 0.5em;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    cursor: pointer;
  }
  .zoom button:hover { background: var(--hover); }
  .zoom button:focus-visible { outline: 4px solid #f59e0b; outline-offset: 2px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 1em 1.2em 0.5em;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
  }
  .frage {
    font-size: 1.15em;
    font-weight: 600;
    margin: 0 0 0.9em;
  }
  .optionen { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5em; }
  .option {
    display: flex;
    gap: 0.7em;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 3px solid var(--line);
    border-radius: 12px;
    padding: 0.45em 0.7em;
    cursor: pointer;
  }
  .option:hover { background: var(--hover); border-color: var(--accent); }
  .option:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  .buchstabe {
    flex: none;
    font-weight: 700;
    min-width: 1.6em;
    height: 1.6em;
    border-radius: 50%;
    background: #e5e7eb;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .option.richtig { border-color: var(--ok); background: var(--ok-bg); }
  .option.richtig .buchstabe { background: var(--ok); color: #fff; }
  .option.falsch { border-color: var(--bad); background: var(--bad-bg); }
  .option.falsch .buchstabe { background: var(--bad); color: #fff; }
  .feedback {
    margin: 0.35em 0 0.2em 1.2em;
    padding: 0.6em 0.9em;
    border-left: 8px solid var(--line);
    border-radius: 6px;
    background: #f9fafb;
  }
  .feedback[hidden] { display: none; }
  .feedback.richtig { border-color: var(--ok); background: var(--ok-bg); }
  .feedback.falsch { border-color: var(--bad); background: var(--bad-bg); }
  .feedback strong { display: block; margin-bottom: 0.15em; }
  .feedback.richtig strong { color: var(--ok); }
  .feedback.falsch strong { color: var(--bad); }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5em;
    padding: 0.5em 1.2em;
    border-top: 2px solid #e5e7eb;
  }
  footer button {
    font: inherit;
    font-size: 0.85em;
    font-weight: 600;
    padding: 0.35em 1.1em;
    border-radius: 10px;
    border: 3px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  footer button.sekundaer { background: #fff; color: var(--accent); }
  footer button:disabled { opacity: 0.35; cursor: default; }
  footer button:focus-visible { outline: 4px solid #f59e0b; outline-offset: 3px; }
  .punkte { display: flex; gap: 0.35em; flex-wrap: wrap; justify-content: center; }
  .punkt {
    width: 0.7em; height: 0.7em; border-radius: 50%;
    background: #d1d5db; border: none; padding: 0; cursor: pointer;
  }
  .punkt.aktiv { background: var(--accent); transform: scale(1.3); }
  @media (max-width: 600px) {
    footer { flex-wrap: wrap; }
    .punkte { order: -1; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <span class="kapitel" id="kapitel"></span>
  <div class="rechts">
    <span id="zaehler"></span>
    <div class="zoom">
      <button id="kleiner" type="button" title="Schrift verkleinern (Taste -)" aria-label="Schrift verkleinern">A−</button>
      <button id="groesser" type="button" title="Schrift vergrößern (Taste +)" aria-label="Schrift vergrößern">A+</button>
    </div>
  </div>
</header>

<main>
  <p class="frage" id="frage"></p>
  <ul class="optionen" id="optionen"></ul>
</main>

<footer>
  <button id="zurueck" type="button">◀ Zurück</button>
  <div class="punkte" id="punkte"></div>
  <div style="display:flex; gap:0.5em;">
    <button id="reset" type="button" class="sekundaer" title="Auswahl dieser Frage zurücksetzen">↺</button>
    <button id="vor" type="button">Weiter ▶</button>
  </div>
</footer>

<script>
const FRAGEN = [
  {
    kapitel: "Kapitel 1: Was ist eine Kraft?",
    frage: "Lea schießt einen Fußball. Der Ball fliegt in hohem Bogen über den Platz. Welche Aussage über den Ball während des Flugs stimmt?",
    richtig: 2,
    optionen: [
      ["Die Kraft von Leas Fuß steckt im Ball und treibt ihn an, bis sie aufgebraucht ist.",
       "Eine Kraft ist kein Vorrat, der im Ball steckt. Eine Kraft wirkt nur, solange zwei Körper aufeinander einwirken. Sobald der Ball den Fuß verlässt, wirkt der Fuß nicht mehr auf ihn."],
      ["Auf den Ball wirkt keine Kraft, weil ihn nichts berührt.",
       "Körper können auch ohne Berührung aufeinander einwirken. Die Erde zieht den Ball an, auch wenn er in der Luft ist. Deshalb fällt er wieder herunter."],
      ["Leas Fuß übt keine Kraft mehr aus. Die Erde zieht den Ball an, und die Luft bremst ihn.",
       "Nach dem Schuss wirkt der Fuß nicht mehr auf den Ball. Die Erde zieht ihn nach unten (Gewichtskraft), und die Luft bremst ihn ab."],
      ["Die Erde zieht am Ball, aber der Ball zieht nicht an der Erde.",
       "Bei einer Kraft wirken immer zwei Körper aufeinander. Die Erde zieht den Ball an, und der Ball zieht auch die Erde an. Bei der riesigen Erde merkt man das nur nicht."]
    ]
  },
  {
    kapitel: "Kapitel 2: Wirkungen von Kräften",
    frage: "Ein Ball wird senkrecht nach oben geworfen. Im höchsten Punkt steht er kurz still und fällt dann wieder herunter. Woran erkennt man, dass auf den Ball eine Kraft wirkt, nachdem er die Hand verlassen hat?",
    richtig: 3,
    optionen: [
      ["Nur auf dem Weg nach unten wirkt eine Kraft, denn nur dann wird der Ball schneller. Langsamer wird er von allein.",
       "Auch zum Langsamerwerden braucht man eine Kraft. Der Ball wird beim Steigen langsamer, weil die Erde ihn nach unten zieht."],
      ["Im höchsten Punkt wirkt keine Kraft, weil der Ball dort kurz stillsteht.",
       "Würde im höchsten Punkt keine Kraft wirken, bliebe der Ball dort in der Luft hängen. Er fällt aber wieder herunter, also wirkt die Gewichtskraft auch dort."],
      ["Gar nicht. Eine Kraft erkennt man nur daran, dass sich ein Körper verformt.",
       "Verformung ist nur eine von zwei Kraftwirkungen. Die andere ist die Änderung des Bewegungszustands: schneller werden, langsamer werden oder die Richtung ändern."],
      ["Der Ball wird beim Steigen langsamer und beim Fallen schneller. Diese Änderungen des Bewegungszustands zeigen, dass die ganze Zeit eine Kraft wirkt.",
       "Der Bewegungszustand des Balls ändert sich ständig. Das ist die Wirkung der Gewichtskraft, die die ganze Zeit auf ihn wirkt."]
    ]
  },
  {
    kapitel: "Kapitel 3: Kraftmessung",
    frage: "Mia hängt ihre Schultasche an einen Federkraftmesser mit dem Messbereich 0 bis 10 N. Die Feder wird bis zum Anschlag gedehnt, die Anzeige steht auf 10 N. Welche Aussage stimmt?",
    richtig: 1,
    optionen: [
      ["Die Tasche hat eine Gewichtskraft von genau 10 N.",
       "Am Anschlag kann die Feder sich nicht weiter dehnen. Ob die Kraft 10 N, 15 N oder 30 N beträgt, zeigt der Kraftmesser dann nicht mehr an."],
      ["Die Gewichtskraft ist mindestens 10 N, vielleicht aber deutlich mehr. Mia braucht einen Kraftmesser mit größerem Messbereich.",
       "Ein Kraftmesser misst nur innerhalb seines Messbereichs zuverlässig. Steht er am Anschlag, ist die Kraft mindestens so groß wie der Höchstwert."],
      ["Die Tasche hat eine Masse von 10 kg.",
       "Der Kraftmesser misst eine Kraft in Newton, keine Masse in Kilogramm. Eine Masse von 10 kg hätte auf der Erde eine Gewichtskraft von etwa 100 N."],
      ["Mia kann trotzdem weitermessen. Die Feder ist elastisch und geht nach jeder Belastung wieder zurück.",
       "Eine Feder ist nur bis zu einer bestimmten Grenze elastisch. Wird sie überdehnt, bleibt sie verformt, und der Kraftmesser ist kaputt. Mehr dazu in Kapitel 7."]
    ]
  },
  {
    kapitel: "Kapitel 4: Darstellen von Kräften",
    frage: "In einer Zeichnung gilt der Maßstab 1 cm ≙ 20 N. Ein Kraftpfeil ist 4 cm lang und zeigt senkrecht nach oben. Welche Aussage stimmt?",
    richtig: 0,
    optionen: [
      ["Die Kraft beträgt 80 N, wirkt nach oben und greift am Anfang des Pfeils an.",
       "4 cm · 20 N pro cm = 80 N. Die Pfeilrichtung zeigt die Richtung der Kraft, der Pfeilanfang den Ansatzpunkt."],
      ["Die Kraft beträgt 4 N, denn der Pfeil ist 4 cm lang.",
       "Die Länge in cm ist nicht der Betrag in N. Erst mit dem Maßstab rechnest du die Länge in eine Kraft um."],
      ["Die Kraft beträgt 5 N, denn 20 : 4 = 5.",
       "Jeder Zentimeter steht für 20 N. Bei 4 cm musst du also multiplizieren: 4 · 20 N = 80 N."],
      ["Die Kraft beträgt 80 N, wirkt nach oben und greift an der Spitze des Pfeils an.",
       "Der Betrag stimmt, aber die Kraft greift am Anfang des Pfeils an. Die Spitze zeigt nur, in welche Richtung die Kraft wirkt."]
    ]
  },
  {
    kapitel: "Kapitel 5: Dichte",
    frage: "Würfel A hat eine Masse von 100 g und ein Volumen von 50 cm³. Würfel B hat eine Masse von 300 g und ein Volumen von 200 cm³. Welche Aussage stimmt?",
    richtig: 3,
    optionen: [
      ["Würfel B hat die größere Dichte, weil er mehr Masse hat.",
       "Die Dichte hängt von Masse und Volumen ab. B hat zwar mehr Masse, aber auch ein viel größeres Volumen. Pro cm³ steckt in B weniger Masse."],
      ["Würfel A hat die größere Dichte, weil kleine Körper immer dichter sind als große.",
       "Das Ergebnis stimmt, aber die Begründung nicht. Ein kleiner Styroporwürfel hat eine kleinere Dichte als ein großer Eisenwürfel. Entscheidend ist das Verhältnis von Masse zu Volumen."],
      ["Man kann nicht sagen, welcher Würfel die größere Dichte hat, solange man das Material nicht kennt.",
       "Man kann die Dichte aus Masse und Volumen berechnen: ρ = m : V. Umgekehrt kann man mit der berechneten Dichte sogar herausfinden, aus welchem Material ein Körper vermutlich besteht."],
      ["Würfel A hat die größere Dichte: Er hat 2 g/cm³, Würfel B nur 1,5 g/cm³.",
       "ρ(A) = 100 g : 50 cm³ = 2 g/cm³ und ρ(B) = 300 g : 200 cm³ = 1,5 g/cm³. A ist leichter, hat aber die größere Dichte."]
    ]
  },
  {
    kapitel: "Kapitel 6: Masse und Gewicht",
    frage: "Ein Paket hat auf der Erde eine Masse von 6 kg. Es wird zum Mond gebracht (g = 1,62 N/kg). Welche Aussage stimmt?",
    richtig: 0,
    optionen: [
      ["Auf dem Mond hat das Paket eine Masse von 6 kg und eine Gewichtskraft von etwa 9,7 N.",
       "Die Masse bleibt überall gleich. Die Gewichtskraft hängt vom Ort ab: F<sub>G</sub> = 6 kg · 1,62 N/kg ≈ 9,7 N."],
      ["Auf dem Mond hat das Paket eine Masse von etwa 1 kg und eine Gewichtskraft von etwa 9,7 N.",
       "Die Gewichtskraft stimmt, aber die Masse ändert sich nicht. Im Paket steckt auf dem Mond genauso viel Materie wie auf der Erde."],
      ["Auf dem Mond hat das Paket eine Masse von 6 kg und eine Gewichtskraft von etwa 59 N.",
       "59 N ist die Gewichtskraft auf der Erde (6 kg · 9,81 N/kg). Auf dem Mond wird das Paket schwächer angezogen, deshalb musst du mit dem Ortsfaktor des Mondes rechnen."],
      ["Auf dem Mond hat das Paket eine Masse von 0 kg und eine Gewichtskraft von 0 N, denn dort ist man schwerelos.",
       "Der Mond zieht Körper an, nur schwächer als die Erde. Deshalb landen Astronauten nach jedem Sprung wieder auf dem Boden. Die Masse ist ohnehin niemals 0 kg."]
    ]
  },
  {
    kapitel: "Kapitel 6: Ortsfaktor",
    frage: "Auf der Erde beträgt der Ortsfaktor g = 9,81 N/kg. Was bedeutet diese Angabe?",
    richtig: 1,
    optionen: [
      ["Jeder Körper auf der Erde hat eine Gewichtskraft von 9,81 N.",
       "9,81 N gilt nur für einen Körper mit 1 kg. Ein Körper mit 5 kg hat eine Gewichtskraft von etwa 49 N."],
      ["Auf der Erde wird jedes Kilogramm Masse mit einer Kraft von 9,81 N angezogen.",
       "Die Einheit N/kg sagt es schon: Newton pro Kilogramm. Für jedes Kilogramm Masse kommen 9,81 N Gewichtskraft dazu."],
      ["Ein fallender Körper bewegt sich auf der Erde mit 9,81 Metern pro Sekunde.",
       "Die Einheit ist N/kg, nicht m/s. Außerdem hat ein fallender Körper keine feste Geschwindigkeit, er wird beim Fallen immer schneller."],
      ["Je größer die Masse eines Körpers ist, desto größer ist sein Ortsfaktor.",
       "Der Ortsfaktor hängt nur vom Ort ab, zum Beispiel Erde oder Mond. Ein schwerer und ein leichter Körper haben am selben Ort denselben Ortsfaktor. Nur ihre Gewichtskräfte sind verschieden."]
    ]
  },
  {
    kapitel: "Kapitel 6: Was eine Waage misst",
    frage: "Eine digitale Personenwaage zeigt auf der Erde 50 kg an. Dieselbe Person stellt sich mit derselben Waage auf den Mond (g = 1,62 N/kg). Was zeigt die Waage dort ungefähr an?",
    richtig: 2,
    optionen: [
      ["50 kg, denn eine Waage misst die Masse, und die ändert sich nicht.",
       "Die Masse der Person bleibt zwar 50 kg, aber die Waage misst sie nicht direkt. Sie misst, wie stark die Person auf sie drückt, also die Gewichtskraft."],
      ["0 kg, denn auf dem Mond gibt es keine Schwerkraft.",
       "Der Mond zieht die Person an, nur etwa sechsmal schwächer als die Erde. Die Waage zeigt also weniger an, aber nicht null."],
      ["Etwa 8 kg, denn die Waage misst eigentlich die Gewichtskraft und rechnet sie mit dem Ortsfaktor der Erde in kg um.",
       "Auf dem Mond hat die Person eine Gewichtskraft von 50 kg · 1,62 N/kg = 81 N. Die Waage teilt durch den Erd-Ortsfaktor: 81 N : 9,81 N/kg ≈ 8 kg. Die Anzeige ist also falsch, die echte Masse ist weiter 50 kg."],
      ["Etwa 81 kg, denn man muss 50 · 1,62 rechnen.",
       "81 ist die Gewichtskraft auf dem Mond, aber in Newton, nicht in Kilogramm. Außerdem wird die Person auf dem Mond schwächer angezogen, die Anzeige muss also kleiner werden und nicht größer."]
    ]
  }
];

const BUCHSTABEN = ["A", "B", "C", "D"];
let index = 0;
const auswahl = new Array(FRAGEN.length).fill(null);

const el = (id) => document.getElementById(id);

function zeige() {
  const f = FRAGEN[index];
  el("kapitel").textContent = f.kapitel;
  el("zaehler").textContent = `Frage ${index + 1} von ${FRAGEN.length}`;
  el("frage").textContent = f.frage;

  const liste = el("optionen");
  liste.innerHTML = "";
  f.optionen.forEach(([text], i) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    btn.innerHTML = `<span class="buchstabe">${BUCHSTABEN[i]}</span><span></span>`;
    btn.lastChild.textContent = text;
    btn.addEventListener("click", () => { auswahl[index] = i; markiere(); });
    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.hidden = true;
    fb.setAttribute("aria-live", "polite");
    li.appendChild(btn);
    li.appendChild(fb);
    liste.appendChild(li);
  });

  markiere();
  el("zurueck").disabled = index === 0;
  el("vor").disabled = index === FRAGEN.length - 1;

  const punkte = el("punkte");
  punkte.innerHTML = "";
  FRAGEN.forEach((_, i) => {
    const p = document.createElement("button");
    p.type = "button";
    p.className = "punkt" + (i === index ? " aktiv" : "");
    p.title = `Frage ${i + 1}`;
    p.setAttribute("aria-label", `Frage ${i + 1}`);
    p.addEventListener("click", () => { index = i; zeige(); });
    punkte.appendChild(p);
  });
  document.querySelector("main").scrollTop = 0;
}

function markiere() {
  const f = FRAGEN[index];
  const gewaehlt = auswahl[index];
  el("optionen").querySelectorAll("li").forEach((li, i) => {
    const b = li.querySelector(".option");
    const fb = li.querySelector(".feedback");
    b.classList.remove("richtig", "falsch");
    b.setAttribute("aria-pressed", i === gewaehlt ? "true" : "false");
    if (i !== gewaehlt) {
      fb.hidden = true;
      fb.innerHTML = "";
      return;
    }
    const ok = i === f.richtig;
    b.classList.add(ok ? "richtig" : "falsch");
    fb.hidden = false;
    fb.className = "feedback " + (ok ? "richtig" : "falsch");
    fb.innerHTML = `<strong>${ok ? "Richtig!" : "Leider falsch."}</strong>${f.optionen[i][1]}`;
  });
}

let zoom = 1;
try { zoom = parseFloat(localStorage.getItem("kraefte-zoom")) || 1; } catch (e) {}
function setzeZoom(z) {
  zoom = Math.min(2.5, Math.max(0.6, Math.round(z * 10) / 10));
  document.documentElement.style.setProperty("--zoom", zoom);
  try { localStorage.setItem("kraefte-zoom", zoom); } catch (e) {}
}
setzeZoom(zoom);
el("groesser").addEventListener("click", () => setzeZoom(zoom + 0.1));
el("kleiner").addEventListener("click", () => setzeZoom(zoom - 0.1));

el("vor").addEventListener("click", () => { if (index < FRAGEN.length - 1) { index++; zeige(); } });
el("zurueck").addEventListener("click", () => { if (index > 0) { index--; zeige(); } });
el("reset").addEventListener("click", () => { auswahl[index] = null; markiere(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") { el("vor").click(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { el("zurueck").click(); }
  else if (e.key === "+") { setzeZoom(zoom + 0.1); }
  else if (e.key === "-") { setzeZoom(zoom - 0.1); }
  else {
    const k = BUCHSTABEN.indexOf(e.key.toUpperCase());
    if (k >= 0) { auswahl[index] = k; markiere(); }
  }
});

zeige();
</script>
</body>
</html>
